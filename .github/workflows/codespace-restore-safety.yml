name: codespace-restore-safety

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespace-restore-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespace-restore-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax for startup scripts
        run: |
          bash -n .devcontainer/install-debian-deps.sh
          bash -n .devcontainer/setup-bgadmin.sh
          bash -n .devcontainer/setup-ai-tools.sh
          bash -n .devcontainer/restore-bgssh-mcp.sh
          bash -n .devcontainer/start-bgssh-http.sh
          bash -n .devcontainer/start-bgssh-funnel.sh
          bash -n .devcontainer/restore-codespace.sh
          bash -n .devcontainer/show-connection.sh
          bash -n .devcontainer/finish-bgdb-setup.sh
      - name: Validate devcontainer JSON and safe restore setup
        run: |
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path(".devcontainer/devcontainer.json").read_text())
          assert c.get("postStartCommand") == "bash /workspaces/BGDB/.devcontainer/restore-codespace.sh"
          assert c.get("postCreateCommand") == "sudo -n bash /workspaces/BGDB/.devcontainer/install-debian-deps.sh"
          assert 8765 in c.get("forwardPorts", [])
          assert c["portsAttributes"]["8765"]["protocol"] == "http"
          assert c["portsAttributes"]["8765"]["onAutoForward"] == "notify"
          ssh=Path(".devcontainer/setup-bgadmin.sh").read_text()
          assert "Port 2222" in ssh
          assert "SSH_STATE=/workspaces/.bgdb-private/ssh-host-keys" in ssh
          assert "/usr/sbin/sshd -t" in ssh
          assert "ssh-keygen -A" in ssh
          assert "install-debian-deps.sh" in ssh
          deps=Path(".devcontainer/install-debian-deps.sh").read_text()
          assert 'dpkg-query -W' in deps
          assert "libpython3.13-stdlib" in deps
          assert "python3.13-venv" in deps
          assert "python3-venv" in deps
          assert "python3-pip-whl" in deps
          assert "python3-setuptools-whl" in deps
          assert "openssh-server" in deps and "curl" in deps
          assert "secrets, venv, ssl, ensurepip" in deps
          assert 'if (( ${#missing[@]} > 0 ))' in deps
          assert "apt-get install -y --no-install-recommends" in deps
          assert "apt-get -y --no-remove dist-upgrade" in deps
          assert 'apt-get update && apt-get -y --no-remove dist-upgrade' in deps
          assert "UPGRADE_INTERVAL_SECONDS" not in deps
          assert "full-upgrade.last-success" not in deps
          assert "Running apt update + safe full-upgrade on every start" in deps
          assert "Full-upgrade requires manual attention" in deps
          first_run=Path(".devcontainer/finish-bgdb-setup.sh").read_text()
          assert "grep -qx 'port 2222'" in first_run
          assert "tee /etc/ssh/sshd_config.d/00-bgdb-password.conf" not in first_run
          assert any("target=/var/lib/tailscale" in m for m in c["mounts"])
          assert "ghcr.io/devcontainers/features/node:1" in c["features"]
          mcp=Path(".devcontainer/restore-bgssh-mcp.sh").read_text()
          assert "127.0.0.1" in mcp and "2222" in mcp
          assert "StrictHostKeyChecking=yes" in mcp
          assert 'export PATH="$HOME/.local/bin:$PATH"' in mcp
          assert "ssh_host_ed25519_key.pub" in mcp
          assert "bgssh.abrdns.com" not in mcp  # HTTPS isn't the Codespace SSH endpoint
          http=Path(".devcontainer/start-bgssh-http.sh").read_text()
          assert "--host 127.0.0.1 --port 8765" in http
          assert 'exec sh "$HOME/.local/share/bgdb-ssh-connector/plugins/ssh-connector/bin/run.sh"' in http
          assert "python3 -I -c 'import secrets, venv, ssl'" in http
          assert ".codex/bgssh-http-token" in http
          assert "head -c 32 /dev/urandom" in http
          assert '[[ ! -s "$TOKEN_FILE" ]]' in http
          assert "print(secrets.token_hex" not in http  # token generation uses kernel CSPRNG
          assert "sudo -n chown vscode:vscode" in http
          assert '[[ -L "$HOME/.codex" || -L "$TOKEN_FILE" ]]' in http
          assert "chmod 600" in http
          assert "trycloudflare" not in http and "cloudflared" not in http
          restore=Path(".devcontainer/restore-codespace.sh").read_text()
          assert "start-bgssh-http.sh" in restore
          assert "start-bgssh-funnel.sh" in restore
          assert "publish-bgssh-codespace-port.sh" not in restore
          funnel=Path(".devcontainer/start-bgssh-funnel.sh").read_text()
          assert "tailscale funnel --yes --bg --https=443 127.0.0.1:8765" in funnel
          assert 'denied" != 401' in funnel
          assert "tailscale status --json" in funnel
          assert "CODESPACE_NAME" not in funnel
          assert "SSH_CONNECTOR_TOKEN" not in funnel
          assert "trycloudflare" not in funnel and "cloudflared" not in funnel
          assert 'gh codespace ports visibility' not in funnel
          assert all(not p.exists() for p in [
              Path(".devcontainer/.env"), Path(".devcontainer/id_rsa"),
              Path(".devcontainer/ssl.key")
          ])
          print("Codespace restore static safety checks PASS (not a live SSH/HTTPS test)")
          PY
