name: BGDB Security Scanner — SSL Labs and PQ TLS

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Public hostname to check, for example money.bg (leave blank for default list)"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/ssllabs-multisite.yml"

permissions:
  contents: write

concurrency:
  group: bgdb-security-scanner
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Verify website first, then fetch SSL Labs reports
        env:
          SSL_LABS_EMAIL: info@bgdb.eu
          TARGET_HOST: ${{ inputs.target_host }}
        run: |
          python3 scripts/ssllabs_scan.py

      - name: Independently test post-quantum TLS on owned BGDB sites
        if: ${{ inputs.target_host == '' || inputs.target_host == 'bgdb.eu' || inputs.target_host == 'bgspiritllc.com' }}
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace alpine:3.23 sh -c 'apk add --no-cache ca-certificates python3 openssl >/dev/null && python3 scripts/pq_tls_scan.py'

      - name: Commit reports and network request traces
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ssl-labs/ reports/preflight/ reports/post-quantum-tls/ reports/transport/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "BGDB security scanner: SSL Labs, website preflight and PQ evidence"
            git push
          fi
